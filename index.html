<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANOTYET</title>
<style>
:root{--cream:#FFF7EB;--navy:#222B42}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--cream);color:var(--navy)}
header{padding:16px;text-align:center;border-bottom:1px solid rgba(34,43,66,.1)}
.logo{display:inline-flex;align-items:center;gap:12px}
.circle{background:var(--navy);color:var(--cream);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:3px}
.brand{font-weight:900;letter-spacing:4px;font-size:22px}
.search{margin:16px auto;max-width:600px;padding:0 16px}
.search input{width:100%;padding:14px 20px;border-radius:30px;border:1.5px solid var(--navy);background:white}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 16px}
.cats button{white-space:nowrap;padding:10px 18px;border-radius:30px;border:1px solid var(--navy);background:white;color:var(--navy);cursor:pointer}
.cats button.active{background:var(--navy);color:var(--cream)}
.banner{background:var(--navy);color:var(--cream);margin:12px 16px;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.hero{padding:24px 16px}
.hero h1{font-size:32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:white;border-radius:16px;border:1px solid rgba(34,43,66,.1);padding:12px;text-align:center}
.ph{height:120px;background:#FFF4DF;border:2px dashed var(--navy);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.price input{width:100%;padding:8px;border:1px solid var(--navy);border-radius:8px;text-align:center;margin-top:8px}
.btn{background:var(--navy);color:var(--cream);border:none;border-radius:10px;padding:10px;width:100%;margin-top:8px}
.cart{position:fixed;top:16px;right:16px;background:var(--navy);color:var(--cream);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header><div class="logo"><div class="circle">...</div><div class="brand">ANOTYET</div></div></header>
<div class="search"><input placeholder="Rechercher un produit, un soin..."></div>
<div class="cats"><button class="active">Tous</button><button>Accessoires</button><button>Parfum</button><button>Bébé</button><button>Soins beauté</button><button>Vêtement</button><button>Livre</button></div>
<div class="banner"><div><b>CLUB VIP — 29,90€ / an</b><br><small>Expédition via fournisseur • -15%</small></div><button style="background:white;color:#222B42;border:none;padding:8px 14px;border-radius:20px">Rejoindre</button></div>
<div class="hero"><h1>Le doux, l'utile, le juste.</h1><p>Sélection ANOTYET - choisie chez nos fournisseurs de confiance.</p></div>
<div class="grid" id="grid"></div>
<div class="cart">🛒</div>
<script>
const grid=document.getElementById('grid');
for(let i=1;i<=20;i++){
const d=document.createElement('div');d.className='card';
d.innerHTML=<div class="ph" onclick="this.innerHTML='<input type=file accept=image/* onchange=preview(this) style=display:none>';this.querySelector('input').click()">AJOUTER VOTRE IMAGE ICI</div><p style="margin-top:8px">Produit ${i}</p><div class="price"><input placeholder="Votre prix ici"></div><button class="btn">Ajouter au panier</button>;
grid.appendChild(d);
}
function preview(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{el.parentElement.innerHTML=<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">};r.readAsDataURL(f)}
</script>
</body>
</html>
